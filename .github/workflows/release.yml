name: release

# Compile the `krom` CLI to a native, self-contained binary for each OS/arch
# and attach them to the GitHub Release when a `vX.Y.Z` tag is pushed.
#
# Resilient design: each build job publishes its OWN binary (+ .sha256) directly
# to the release, so a slow or unavailable runner (e.g. the retiring macOS Intel
# pool) never blocks the other platforms. install.sh downloads the right asset.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Le tag est le troisième endroit où la version est écrite, après pubspec.yaml
  # et `kromVersion`. Un test garde les deux fichiers d'accord entre eux, mais
  # rien ne les reliait au tag : 0.3.18 et 0.3.19 sont parties avec un binaire
  # qui annonçait autre chose que son propre nom, et un utilisateur qui
  # réinstalle croit alors que l'installation a échoué. Publier est irréversible
  # — mieux vaut échouer ici.
  check_version:
    name: le tag correspond à la source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag, pubspec et kromVersion
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          pubspec=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          constant=$(grep -m1 'const String kromVersion' bin/krom_bundler.dart \
                     | sed "s/.*'\(.*\)'.*/\1/")
          echo "tag=$expected pubspec=$pubspec kromVersion=$constant"
          if [ "$pubspec" != "$expected" ] || [ "$constant" != "$expected" ]; then
            echo "::error::Le tag $TAG ne correspond pas à la source " \
                 "(pubspec=$pubspec, kromVersion=$constant). " \
                 "Alignez les trois avant de taguer."
            exit 1
          fi

  create_release:
    name: ensure release
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "krom ${TAG#v}" --generate-notes
      # L'installeur se sert depuis la release, pas depuis raw.githubusercontent :
      # les limites anonymes de raw rendent `curl | sh` aléatoire derrière un
      # NAT partagé (429 constaté), quand le stockage des releases les tolère.
      - name: Attach install.sh to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" install.sh --repo "$GITHUB_REPOSITORY" --clobber

  build:
    name: build ${{ matrix.asset }}
    needs: [check_version, create_release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: krom-darwin-arm64
            dart_arch: arm64
            check_arch: arm64
          # Le pool Intel (macos-13) ne rend plus de runner : v0.4.0 et v0.5.0
          # sont parties sans binaire x64. Il se compile désormais sur le runner
          # arm64, avec le SDK Dart x64 exécuté par Rosetta — un SDK x64 émet de
          # l'x64, `dart compile exe` visant l'hôte qu'il croit être.
          - os: macos-14
            asset: krom-darwin-x64
            dart_arch: x64
            check_arch: x86_64
          - os: ubuntu-latest
            asset: krom-linux-x64
            dart_arch: x64
          - os: ubuntu-24.04-arm
            asset: krom-linux-arm64
            dart_arch: arm64
          - os: windows-latest
            asset: krom-windows-x64.exe
            dart_arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          architecture: ${{ matrix.dart_arch }}
      - name: Resolve dependencies
        run: dart pub get
      - name: Compile native executable
        shell: bash
        run: dart compile exe bin/krom_bundler.dart -o "${{ matrix.asset }}"
      # Si setup-dart ignorait l'architecture demandée, on publierait un binaire
      # arm64 sous un nom x64 — « Bad CPU type » chez l'utilisateur, pire qu'un
      # asset absent. Vérifier coûte une ligne.
      - name: Verify binary architecture
        if: ${{ matrix.check_arch }}
        run: |
          file "${{ matrix.asset }}"
          file "${{ matrix.asset }}" | grep -q "${{ matrix.check_arch }}"
      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
